plugins {
    id "net.fabricmc.fabric-loom-remap"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "witch-hat-magic"
}

loom {
    splitEnvironmentSourceSets()

    runs.configureEach {
        runDir = rootProject.file("run-magic").absolutePath
    }

    mods {
        "witch_hat_magic" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

sourceSets {
    main {
        java.srcDir "src/main/generated/java"
        resources.srcDir "src/main/generated/resources"
    }
    test {
        compileClasspath += sourceSets.client.output
        runtimeClasspath += sourceSets.client.output
    }
}

tasks.named("compileTestJava") {
    dependsOn tasks.named("compileClientJava")
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
