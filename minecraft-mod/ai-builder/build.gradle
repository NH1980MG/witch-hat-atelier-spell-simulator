plugins {
    id "net.fabricmc.fabric-loom-remap"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "witchhat-ai-builder"
}

loom {
    splitEnvironmentSourceSets()

    runs.configureEach {
        runDir = rootProject.file("run").absolutePath
    }

    mods {
        "witchhat_ai_builder" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.google.code.gson:gson:2.11.0"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.register("installExamplePlan", Copy) {
    from(rootProject.file("examples/test_platform.json"))
    into(rootProject.file("run/config/witchhat-ai-builder/plans"))
}

tasks.named("runClient").configure {
    dependsOn("installExamplePlan")
}

tasks.named("runServer").configure {
    dependsOn("installExamplePlan")
}
