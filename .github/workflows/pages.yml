name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Validate public build
        run: |
          node --test tests/*.test.mjs
          node scripts/validate-spell-matrix.mjs
          node scripts/security-audit.mjs

      - name: Prepare public site
        run: |
          mkdir -p public/assets
          cp ./*.html ./*.css ./*.js ./*.mjs public/
          cp robots.txt sitemap.xml public/
          cp -R assets/brand public/assets/brand
          cp -R assets/library-schematics public/assets/library-schematics
          cp -R assets/symbol-glyphs public/assets/symbol-glyphs
          cp -R vendor public/vendor
          mkdir -p public/duel
          cp duel/*.html duel/*.css duel/*.mjs public/duel/
          cp -R duel/assets duel/vendor public/duel/
          touch public/.nojekyll

      - name: Audit public artifact
        run: node scripts/validate-public-artifact.mjs public

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
